name: build-patched-apk

# 云编译：从「官方原包」生成重定向改包 APK（已签名）
#
# 使用前提：提供**未改动的官方原包**，二选一：
#   ① 直链（默认）：base_url 指向官方原包 .apk 的下载地址（Release 资源直链即可）
#   ② Release tag：把官方原包作为 Release 资源上传到 tag = base_tag
#      gh release create base ./官方原包.apk
# 然后在此仓库 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
    inputs:
      host:
        description: "自建服务器地址（改包后客户端指向它）"
        default: "127.0.0.1"
        required: true
      port:
        description: "调度端口"
        default: "10086"
        required: true
      keyid:
        description: "dispatch keyId"
        default: "4"
        required: true
      hook:
        description: "hook 模式：保留真域名(过 4214 校验)，注入 libyshook.so 把流量导向自建服"
        default: "true"
        required: false
      base_url:
        description: "官方原包直链（留空则改用下面的 base_tag 从 Release 下载）"
        default: "https://github.com/DuDu2255/Genshin-Impact-Android-Client-Redirect/releases/download/7.1.0/yuanshen_7.1.0.apk"
        required: false
      base_tag:
        description: "存放官方原包的 Release tag（base_url 留空时生效）"
        default: "base"
        required: false
  push:
    tags: ["build-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ github.event.inputs.host || '127.0.0.1' }}
      PORT: ${{ github.event.inputs.port || '10086' }}
      KEYID: ${{ github.event.inputs.keyid || '4' }}
      HOOK: ${{ github.event.inputs.hook || 'true' }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://github.com/DuDu2255/Genshin-Impact-Android-Client-Redirect/releases/download/7.1.0/yuanshen_7.1.0.apk' }}
      BASE_TAG: ${{ github.event.inputs.base_tag || 'base' }}
      KS_PASS: "yspatch123"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --quiet lz4
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip >/dev/null

      - name: Download official base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base
          if [ -n "$BASE_URL" ]; then
            echo "从直链下载官方原包：$BASE_URL"
            curl -fL --retry 3 --retry-delay 5 -o base/yuanshen_base.apk "$BASE_URL"
          else
            echo "从 Release tag=$BASE_TAG 下载官方原包"
            gh release download "$BASE_TAG" --pattern "*.apk" --dir base --clobber \
              || { echo "::error::未找到 Release tag=$BASE_TAG 下的 .apk。请上传官方原包或改用 base_url。"; exit 1; }
          fi
          ls -la base/

      - name: Patch APK
        run: |
          BASE=$(ls base/*.apk | head -1)
          mkdir -p out
          HOOKFLAG=""
          if [ "$HOOK" = "true" ]; then
            echo "== hook 模式：保留真域名，注入 patch/libs/libyshook.so =="
            HOOKFLAG="--hook-so patch/libs/libyshook.so"
          fi
          python3 patch/patch_apk.py \
            --in "$BASE" --out out/patched_unsigned.apk \
            --host "$HOST" --port "$PORT" --keyid "$KEYID" \
            $HOOKFLAG \
            --java java \
            --baksmali patch/libs/baksmali.jar \
            --smali patch/libs/smali.jar \
            --workdir "$RUNNER_TEMP/work"

      - name: Sign APK (uber-apk-signer, 内置 zipalign + v1/v2/v3)
        run: |
          curl -sSL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar \
            --apks out/patched_unsigned.apk \
            --ks keystore/yspatch.keystore --ksAlias yspatch \
            --ksPass "$KS_PASS" --ksKeyPass "$KS_PASS" \
            --out out/signed
          ls -la out/signed/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: out/signed/*.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/signed/*.apk \
            --title "patched apk $TAG (host=$HOST:$PORT, keyId=$KEYID)" \
            --notes "由 GitHub Actions 从官方原包自动改包并签名。目标服务器 $HOST:$PORT，keyId=$KEYID。" \
            || gh release upload "$TAG" out/signed/*.apk --clobber
